<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cloud Vibrant Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="45%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Accent Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff9900" flood-opacity="0.45" />
    </filter>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Inner Tech Pattern Lines -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.2" />

  <!-- Cloud Shape with Glow -->
  <g filter="url(#glow)">
    <path 
      d="M45.5 35.5 C48.5 35.5 51 33 51 30 C51 27.2 49 24.8 46.2 24.5 C45.5 19.5 41.2 16 36 16 C32.2 16 28.9 18 27 21 C25.8 20.4 24.5 20 23 20 C19.1 20 16 23.1 16 27 C16 27.5 16.1 28 16.2 28.5 C14.3 29.5 13 31.6 13 34 C13 37.3 15.7 40 19 40 L45.5 40 C48.5 40 51 37.5 51 34.5 C51 34.2 51 33.8 50.9 33.5"
      fill="url(#cloudGrad)"
    />
  </g>

  <!-- Lightning / Terminal Accent Inside Cloud -->
  <path 
    d="M30 23 L25 31 L31 31 L27 38 L36 29 L31 29 Z" 
    fill="#ffffff" 
    opacity="0.95"
  />

  <!-- AWS Signature Golden Smile Arrow -->
  <path 
    d="M17 46 C26 53 38 53 47 46" 
    fill="none" 
    stroke="#ff9900" 
    stroke-width="2.5" 
    stroke-linecap="round"
  />
  <path 
    d="M44.5 45.5 L47.5 46.2 L46.2 49" 
    fill="none" 
    stroke="#ff9900" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>